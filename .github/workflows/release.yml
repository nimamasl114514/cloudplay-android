name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/CloudPlay-${GITHUB_REF_NAME:-manual}.apk"
          ls -lh out

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "out/CloudPlay-${GITHUB_REF_NAME}.apk" \
            --title "CloudPlay Android $GITHUB_REF_NAME" \
            --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: cloudplay-release-apk
          path: out/*.apk
          retention-days: 30
